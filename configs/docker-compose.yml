version: "3.8"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: shippix_db
      POSTGRES_USER: shippix
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shippix -d shippix_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  auth-service:
    build:
      context: ..
      dockerfile: deployments/docker/auth-service/Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - kafka
    environment:
      - DB_HOST=postgres
      - KAFKA_BROKERS=kafka:9092
  shipment-service:
    build:
      context: ..
      dockerfile: deployments/docker/shipment-service/Dockerfile
    ports:
      - "8082:8082"
    depends_on:
      - postgres
      - kafka
    environment:
      - DB_HOST=postgres
      - KAFKA_BROKERS=kafka:9092

  tracking-service:
    build:
      context: ..
      dockerfile: deployments/docker/tracking-service/Dockerfile
    ports:
      - "8083:8083"
    depends_on:
      - postgres
      - kafka
    environment:
      - DB_HOST=postgres
      - KAFKA_BROKERS=kafka:9092

  courier-service:
    build:
      context: ..
      dockerfile: deployments/docker/courier-service/Dockerfile
    ports:
      - "8084:8084"
    depends_on:
      - postgres
      - kafka
    environment:
      - DB_HOST=postgres
      - KAFKA_BROKERS=kafka:9092

  notification-service:
    build:
      context: ..
      dockerfile: deployments/docker/notification-service/Dockerfile
    ports:
      - "8085:8085"
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKERS=kafka:9092

  route-service:
    build:
      context: ..
      dockerfile: deployments/docker/route-service/Dockerfile
    ports:
      - "8086:8086"
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKERS=kafka:9092

volumes:
  postgres_data:
